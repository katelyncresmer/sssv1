<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social → Search · B-Roll Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7fffe;
  --teal: #2abf9a;
  --tl: #6ef2d2;
  --rose: #c89a97;
  --dark: #111;
  --serif: 'Instrument Serif', serif;
  --sans: 'DM Sans', sans-serif;
}
html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--bg);
  font-family: var(--sans); color: var(--dark);
  user-select: none; cursor: default;
}
.scene {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
.scene.active { opacity: 1; pointer-events: all; }

/* Only used for the shake effect — oscillation can't be done with transitions */
@keyframes shakeIt {
  0%,100% { transform: translateX(0) rotate(0); }
  18%  { transform: translateX(-9px) rotate(-.6deg); }
  36%  { transform: translateX(9px)  rotate(.6deg); }
  54%  { transform: translateX(-6px) rotate(-.3deg); }
  72%  { transform: translateX(6px)  rotate(.3deg); }
  88%  { transform: translateX(-3px); }
}
@keyframes arrowBounce {
  0%,100% { transform: translateX(0); }
  50%     { transform: translateX(10px); }
}
@keyframes cursor {
  0%,100% { border-right-color: var(--dark); }
  50%     { border-right-color: transparent; }
}
@keyframes strikeDraw {
  from { transform: scaleX(0); transform-origin: left; }
  to   { transform: scaleX(1); transform-origin: left; }
}

#nav {
  position: fixed; bottom: 22px; right: 28px;
  font-family: var(--sans); font-size: 11px; font-weight: 500;
  color: #ccc; letter-spacing: .1em; z-index: 9999;
}
</style>
</head>
<body>

<div class="scene" id="s1"></div>
<div class="scene" id="s2"></div>
<div class="scene" id="s3"></div>
<div class="scene" id="s4"></div>
<div class="scene" id="s5"></div>
<div class="scene" id="s6"></div>
<div class="scene" id="s7"></div>
<div class="scene" id="s8"></div>
<div class="scene" id="s9"></div>
<div class="scene" id="s10"></div>
<div class="scene" id="s11"></div>
<div class="scene" id="s12"></div>
<div id="nav"></div>

<script>
/* ═══════════════════════════════════════════
   CORE ANIMATION ENGINE
   Uses CSS transitions — no fill-mode issues,
   GPU-accelerated opacity + transform only.
═══════════════════════════════════════════ */

const TR      = 'opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)';
const TR_SLAM = 'transform .65s cubic-bezier(.34,1.4,.64,1),opacity .38s ease';
const TR_SLOW = 'opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)';
const TR_FADE = 'opacity .55s ease';

let timers = [], rafs = [];

function tick(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); }
function clearAll() { timers.forEach(clearTimeout); rafs.forEach(cancelAnimationFrame); timers = []; rafs = []; }

// Force browser to flush style changes so transitions start from the correct state
function reflow(el) { void el.offsetHeight; }

/* ── prep: set "from" state instantly (no transition) ── */
function pflyUp(el)    { el.style.cssText += ';transition:none;opacity:0;transform:translateY(30px)'; }
function pflyDown(el)  { el.style.cssText += ';transition:none;opacity:0;transform:translateY(-30px)'; }
function pflyRight(el) { el.style.cssText += ';transition:none;opacity:0;transform:translateX(-65px)'; }
function pflyLeft(el)  { el.style.cssText += ';transition:none;opacity:0;transform:translateX(65px)'; }
function pslam(el)     { el.style.cssText += ';transition:none;opacity:0;transform:scale(2.4) translateY(-12px)'; }
function pfade(el)     { el.style.cssText += ';transition:none;opacity:0'; }

/* ── show: arm transition + trigger (the reflow makes transition start from prep state) ── */
function show(el, delay, tr = TR) {
  tick(() => {
    el.style.transition = tr;
    reflow(el);
    el.style.opacity = '1';
    el.style.transform = 'none';
  }, delay);
}
function showFade(el, delay) {
  tick(() => {
    el.style.transition = TR_FADE;
    reflow(el);
    el.style.opacity = '1';
  }, delay);
}

/* ── hide instantly (for reset) ── */
function hide(el) {
  el.style.transition = 'none';
  el.style.opacity    = '0';
}
function hideAll(...els) { els.forEach(hide); }

/* ── word-by-word spans ── */
function wordSpans(text, stagger = 85, baseDelay = 0) {
  return text.split(' ').map((word, i) => {
    const s = document.createElement('span');
    s.textContent = word;
    s.style.display = 'inline-block';
    s.style.marginRight = '0.28em';
    s.style.opacity = '0';
    s.style.transform = 'translateY(28px)';
    const delay = baseDelay + i * stagger;
    s.style.transition = `opacity .5s cubic-bezier(.22,1,.36,1) ${delay}ms,transform .5s cubic-bezier(.22,1,.36,1) ${delay}ms`;
    s._tr = s.style.transition;
    return s;
  });
}

function showWords(spans, parent) {
  // Restore transitions (may have been nuked by reset)
  spans.forEach(s => { s.style.transition = s._tr; });
  reflow(parent || spans[0].parentNode);
  spans.forEach(s => { s.style.opacity = '1'; s.style.transform = 'none'; });
}

function hideWords(spans) {
  spans.forEach(s => {
    s.style.transition = 'none';
    s.style.opacity = '0';
    s.style.transform = 'translateY(28px)';
  });
}

/* ── number counter ── */
function countTo(el, from, to, duration, decimals = 0, onDone) {
  const start = performance.now();
  const ease  = t => 1 - Math.pow(1 - t, 3);
  const step  = now => {
    const p = Math.min((now - start) / duration, 1);
    el.textContent = (from + (to - from) * ease(p)).toFixed(decimals);
    if (p < 1) { const id = requestAnimationFrame(step); rafs.push(id); }
    else if (onDone) onDone();
  };
  const id = requestAnimationFrame(step);
  rafs.push(id);
}

/* ── strikethrough ── */
function strike(el, delay) {
  tick(() => {
    el.style.animation = 'strikeDraw .5s ease forwards';
  }, delay);
}
function unstrike(el) {
  el.style.animation = 'none';
  el.style.transform = 'scaleX(0)';
}

/* ── generic element builder ── */
function el(tag, css, html) {
  const e = document.createElement(tag);
  if (css)  e.style.cssText = css;
  if (html) e.innerHTML = html;
  return e;
}

/* ═══════════════════════════════════════════
   SCENE BUILDERS
═══════════════════════════════════════════ */

/* ─── S1: Your content expires ─── */
function buildS1() {
  const root = document.getElementById('s1');
  root.style.cssText = 'text-align:center;align-items:center;justify-content:center;gap:0';

  const label = el('div',
    'font-family:var(--sans);font-size:clamp(12px,1.8vw,17px);font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#aaa;margin-bottom:clamp(10px,2vh,22px)');
  label.textContent = 'you spent hours creating this';

  const numRow = el('div', 'display:flex;align-items:flex-end;justify-content:center;gap:16px');
  const numEl  = el('div',
    'font-family:var(--serif);font-size:clamp(130px,23vw,310px);line-height:.88;color:var(--dark)');
  numEl.textContent = '48';
  const unitEl = el('div',
    'font-family:var(--sans);font-size:clamp(26px,4.5vw,64px);font-weight:700;color:var(--rose);padding-bottom:clamp(14px,2vw,24px);letter-spacing:-.01em');
  unitEl.textContent = 'HOURS';
  numRow.append(numEl, unitEl);

  const sub = el('div',
    'font-family:var(--sans);font-size:clamp(14px,2vw,20px);color:#999;margin-top:clamp(14px,2.5vh,30px)');
  sub.textContent = 'before the algorithm stops showing it';

  root.append(label, numRow, sub);

  return {
    play() {
      pflyDown(label); pflyDown(numEl); pflyDown(unitEl); pflyDown(sub);

      show(label,  0);
      show(numEl,  180, TR_SLAM);
      show(unitEl, 320, TR_SLAM);

      tick(() => {
        countTo(numEl, 48, 2, 1800, 0, () => {
          numEl.style.color = 'var(--rose)';
          numEl.style.animation = 'shakeIt .5s ease';
          tick(() => { numEl.style.animation = ''; }, 520);
        });
      }, 500);

      show(sub, 1400);
    },
    reset() {
      hideAll(label, numEl, unitEl, sub);
      numEl.style.color = 'var(--dark)';
      numEl.style.animation = '';
      numEl.textContent = '48';
    }
  };
}

/* ─── S2: Half-life bars ─── */
function buildS2() {
  const root = document.getElementById('s2');
  root.style.cssText = 'align-items:flex-start;padding-left:max(40px,7vw);padding-right:0;justify-content:center';

  const title = el('div',
    'font-family:var(--sans);font-size:clamp(11px,1.4vw,14px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#aaa;margin-bottom:clamp(20px,4vh,44px)');
  title.textContent = 'content half-life  ·  when 50% of all engagement dies';
  root.appendChild(title);

  const BARS = [
    { name: 'TikTok',    hrs: 0.08,        fill: 'background:var(--rose);opacity:.45',  val: '~0 min'   },
    { name: 'Instagram', hrs: 18.27,        fill: 'background:var(--rose)',              val: '18.27 hrs' },
    { name: 'LinkedIn',  hrs: 23,           fill: 'background:#b5a5a2',                  val: '23 hrs'   },
    { name: 'Podcast',   hrs: 7 * 24,       fill: 'background:#999',                     val: '7 days'   },
    { name: 'YouTube',   hrs: 10 * 24,      fill: 'background:linear-gradient(90deg,var(--teal),var(--tl))', val: '10 days'  },
    { name: 'Blogging',  hrs: 2 * 365 * 24, fill: 'background:linear-gradient(90deg,var(--teal),var(--tl),var(--teal),var(--tl))', val: '2 YEARS', special: true },
  ];

  const rowEls = [], fillEls = [], valEls = [];

  BARS.forEach(b => {
    const row = el('div', 'display:flex;align-items:center;margin-bottom:clamp(8px,1.6vh,16px)');
    const lbl = el('div',
      'font-family:var(--sans);font-size:clamp(10px,1.2vw,13px);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#555;width:82px;flex-shrink:0;text-align:right;padding-right:14px');
    lbl.textContent = b.name;

    const track = el('div', 'overflow:hidden;flex:1;max-width:65vw');
    const fill  = el('div',
      `height:clamp(18px,2.8vh,28px);width:0;border-radius:0 3px 3px 0;transition:none;${b.fill}`);
    if (b.special) fill.style.backgroundSize = '300% 100%';
    track.appendChild(fill);

    const vs = b.special
      ? 'font-family:var(--sans);font-size:clamp(13px,1.8vw,18px);font-weight:700;color:var(--teal);margin-left:14px;white-space:nowrap;opacity:0;transition:none'
      : 'font-family:var(--sans);font-size:clamp(10px,1.2vw,13px);font-weight:600;color:#888;margin-left:12px;white-space:nowrap;opacity:0;transition:none';
    const valEl = el('div', vs);
    valEl.textContent = b.val;

    row.append(lbl, track, valEl);
    root.appendChild(row);
    rowEls.push(row); fillEls.push(fill); valEls.push(valEl);
  });

  return {
    play() {
      pflyRight(title);
      show(title, 0);

      BARS.forEach((b, i) => {
        pflyRight(rowEls[i]);
        show(rowEls[i], 250 + i * 260);

        tick(() => {
          const trackW = fillEls[i].parentNode.offsetWidth || window.innerWidth * 0.65;
          const maxHrs = 10 * 24;
          let targetPx;
          if (b.special) {
            targetPx = Math.max(window.innerWidth * 2, 2400);
          } else {
            targetPx = Math.max((b.hrs / maxHrs) * trackW, 5);
          }
          fillEls[i].style.transition = 'width 1.3s cubic-bezier(.22,1,.36,1)';
          reflow(fillEls[i]);
          fillEls[i].style.width = targetPx + 'px';
        }, 350 + i * 260);

        tick(() => {
          valEls[i].style.transition = TR_FADE;
          reflow(valEls[i]);
          valEls[i].style.opacity = '1';
        }, 350 + i * 260 + 1350);
      });
    },
    reset() {
      hide(title);
      rowEls.forEach((r, i) => {
        hide(r);
        fillEls[i].style.transition = 'none';
        fillEls[i].style.width = '0';
        valEls[i].style.transition = 'none';
        valEls[i].style.opacity = '0';
      });
    }
  };
}

/* ─── S3: Feed the machine ─── */
function buildS3() {
  const root = document.getElementById('s3');
  root.style.cssText = 'overflow:hidden';

  const configs = [
    { txt: 'fresh content',    size: 'clamp(18px,2.5vw,28px)', x: '50%', y: '74%', col: '#bbb',        italic: true  },
    { txt: 'FRESH CONTENT',    size: 'clamp(36px,5.5vw,64px)', x: '50%', y: '62%', col: 'var(--dark)', italic: false },
    { txt: 'FRESH CONTENT',    size: 'clamp(52px,7.5vw,88px)', x: '50%', y: '50%', col: 'var(--teal)', italic: false },
    { txt: 'FRESH CONTENT',    size: 'clamp(68px,11vw,128px)', x: '50%', y: '38%', col: 'var(--dark)', italic: false },
    { txt: 'FRESH CONTENT',    size: 'clamp(84px,14vw,168px)', x: '50%', y: '52%', col: 'var(--rose)', italic: false },
  ];

  const items = configs.map(c => {
    const d = el('div',
      `font-family:var(--serif);font-size:${c.size};font-style:${c.italic ? 'italic':'normal'};` +
      `color:${c.col};position:absolute;left:${c.x};transform:translateX(-50%);top:${c.y};` +
      `white-space:nowrap;line-height:1;letter-spacing:-.02em;opacity:0`);
    d.textContent = c.txt;
    root.appendChild(d);
    return d;
  });

  const forever = el('div',
    'font-family:var(--sans);font-size:clamp(15px,2.5vw,30px);font-weight:700;color:var(--rose);' +
    'position:absolute;bottom:11vh;left:50%;transform:translateX(-50%);white-space:nowrap;' +
    'letter-spacing:.02em;opacity:0');
  forever.textContent = 'every. single. day.  forever??  constantly???';
  root.appendChild(forever);

  return {
    play() {
      items.forEach(e => pflyDown(e));
      pflyDown(forever);

      items.forEach((e, i) => show(e, i * 500, TR_SLAM));
      tick(() => {
        items.forEach(e => { e.style.animation = 'shakeIt .5s ease'; });
        tick(() => { items.forEach(e => { e.style.animation = ''; }); }, 520);
      }, items.length * 500 + 100);

      show(forever, items.length * 500 + 200);
    },
    reset() {
      hideAll(...items, forever);
      items.forEach(e => { e.style.animation = ''; });
    }
  };
}

/* ─── S4: Your time cost ─── */
function buildS4() {
  const root = document.getElementById('s4');
  root.style.cssText = 'text-align:center;align-items:center;justify-content:center;padding:clamp(40px,6vw,80px)';

  const q = el('div',
    'font-family:var(--sans);font-size:clamp(15px,2.2vw,24px);font-weight:400;color:#888;' +
    'margin-bottom:clamp(16px,3vh,40px);max-width:560px;line-height:1.55');
  q.textContent = 'how long does it take to make one high-quality piece of content?';

  const numRow = el('div', 'display:flex;align-items:flex-end;justify-content:center;gap:14px');
  const numEl  = el('div',
    'font-family:var(--serif);font-size:clamp(120px,20vw,260px);line-height:.9;color:var(--dark)');
  numEl.textContent = '0';
  const hrLbl = el('div',
    'font-family:var(--sans);font-size:clamp(20px,3.5vw,44px);font-weight:700;color:var(--teal);' +
    'padding-bottom:clamp(10px,1.5vw,18px);letter-spacing:-.02em');
  hrLbl.textContent = 'HOURS';
  numRow.append(numEl, hrLbl);

  const perDay = el('div',
    'font-family:var(--sans);font-size:clamp(14px,2vw,22px);font-weight:500;color:#aaa;margin-top:clamp(10px,1.5vh,20px);letter-spacing:.04em');
  perDay.textContent = '× every single day';

  const result = el('div',
    'font-family:var(--serif);font-size:clamp(22px,3.8vw,52px);font-style:italic;color:var(--rose);margin-top:clamp(8px,1.2vh,16px)');
  result.textContent = "that's your entire year.";

  root.append(q, numRow, perDay, result);

  return {
    play() {
      pflyDown(q); pflyDown(numEl); pflyDown(hrLbl); pflyDown(perDay); pflyDown(result);

      show(q, 0);
      show(numEl,  500, TR_SLAM);
      show(hrLbl,  640, TR_SLAM);
      tick(() => countTo(numEl, 0, 3, 1400, 0), 800);
      show(perDay, 2400);
      show(result, 3100);
    },
    reset() {
      hideAll(q, numEl, hrLbl, perDay, result);
      numEl.textContent = '0';
    }
  };
}

/* ─── S5: 2 Years ─── */
function buildS5() {
  const root = document.getElementById('s5');
  root.style.cssText = 'text-align:center;align-items:center;justify-content:center';

  const topLbl = el('div',
    'font-family:var(--sans);font-size:clamp(11px,1.5vw,15px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#aaa;margin-bottom:clamp(8px,1.5vh,16px)');
  topLbl.textContent = 'blog post half-life';

  const bigRow = el('div', 'display:flex;align-items:flex-end;justify-content:center;gap:16px;line-height:1');
  const bigNum = el('div',
    'font-family:var(--serif);font-size:clamp(140px,26vw,340px);line-height:.85;color:var(--teal)');
  bigNum.textContent = '0';
  const yrLbl = el('div',
    'font-family:var(--sans);font-size:clamp(28px,5vw,68px);font-weight:700;color:var(--teal);letter-spacing:-.02em;padding-bottom:clamp(12px,2vw,22px)');
  yrLbl.textContent = 'YEARS';
  bigRow.append(bigNum, yrLbl);

  const note = el('div',
    'font-family:var(--sans);font-size:clamp(12px,1.6vw,17px);font-style:italic;color:#aaa;margin-top:clamp(8px,1.2vh,16px)');
  note.textContent = "(that's just the half-life)";

  // VS row
  const vsRow = el('div',
    'display:flex;align-items:center;gap:clamp(16px,3vw,40px);margin-top:clamp(24px,4vh,48px);justify-content:center');

  const makeItem = (platform, time, color) => {
    const wrap = el('div', 'text-align:center');
    const t    = el('div', `font-family:var(--serif);font-size:clamp(22px,3.5vw,44px);color:${color};position:relative;display:inline-block`);
    t.textContent = time;
    const bar  = el('div',
      'position:absolute;left:0;top:50%;width:100%;height:2.5px;background:var(--rose);transform:scaleX(0);transform-origin:left');
    t.appendChild(bar);
    const p = el('div', 'font-family:var(--sans);font-size:clamp(9px,1.1vw,12px);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#bbb;margin-top:4px');
    p.textContent = platform;
    wrap.append(t, p);
    return { wrap, bar };
  };

  const ig  = makeItem('Instagram', '18 hrs', 'var(--rose)');
  const sep = el('div', 'font-family:var(--sans);font-size:clamp(16px,2.5vw,28px);color:#ddd;align-self:center');
  sep.textContent = '·';
  const li  = makeItem('LinkedIn', '23 hrs', '#b5a5a2');
  vsRow.append(ig.wrap, sep, li.wrap);

  root.append(topLbl, bigRow, note, vsRow);

  return {
    play() {
      pflyDown(topLbl); pflyDown(bigNum); pflyDown(yrLbl); pflyDown(note);
      pflyDown(vsRow);
      ig.bar.style.animation = 'none'; ig.bar.style.transform = 'scaleX(0)';
      li.bar.style.animation = 'none'; li.bar.style.transform = 'scaleX(0)';

      show(topLbl, 0);
      show(bigNum,  280, TR_SLAM);
      show(yrLbl,   420, TR_SLAM);
      tick(() => countTo(bigNum, 0, 2, 1500, 0), 500);
      show(note, 1800);
      show(vsRow, 2200);
      tick(() => {
        ig.bar.style.animation = 'strikeDraw .5s ease forwards';
        li.bar.style.animation = 'strikeDraw .5s ease .15s forwards';
      }, 2900);
    },
    reset() {
      hideAll(topLbl, bigNum, yrLbl, note, vsRow);
      bigNum.textContent = '0';
      ig.bar.style.animation = 'none'; ig.bar.style.transform = 'scaleX(0)';
      li.bar.style.animation = 'none'; li.bar.style.transform = 'scaleX(0)';
    }
  };
}

/* ─── S6: Compounds ─── */
function buildS6() {
  const root = document.getElementById('s6');
  root.style.cssText = 'align-items:center;justify-content:center;padding:clamp(40px,6vw,80px)';

  const title = el('div',
    'font-family:var(--sans);font-size:clamp(11px,1.4vw,14px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#aaa;margin-bottom:clamp(20px,4vh,44px)');
  title.textContent = 'SEO content compounds — every post adds to the last';

  const HEIGHTS = [15, 26, 40, 56, 72, 88, 100];
  const chartWrap = el('div', 'display:flex;align-items:flex-end;gap:clamp(6px,1.2vw,14px);height:clamp(140px,22vh,220px)');

  const bars = HEIGHTS.map((h, i) => {
    const col = el('div', 'display:flex;flex-direction:column;align-items:center;gap:8px');
    const bar = el('div',

/* ═══════════════════════════════════════════
   SCENE MANAGEMENT
═══════════════════════════════════════════ */
const builders = [buildS1, buildS2, buildS3, buildS4, buildS5, buildS6, buildS7, buildS8, buildS9, buildS10, buildS11, buildS12];
const ctrls    = builders.map((fn, i) => { const c = fn(); c.el = document.getElementById(`s${i+1}`); return c; });

let current = 0;

function goTo(idx) {
  if (idx < 0 || idx >= ctrls.length) return;
  clearAll();
  ctrls[current].el.classList.remove('active');
  ctrls[current].reset();
  current = idx;
  ctrls[current].el.classList.add('active');
  setTimeout(() => ctrls[current].play(), 40);
  document.getElementById('nav').textContent = `${idx + 1} / ${ctrls.length}`;
}

document.addEventListener('keydown', e => {
  if      (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo(current + 1); }
  else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goTo(current - 1); }
  else if (e.key === 'r' || e.key === 'R')                  { e.preventDefault(); clearAll(); ctrls[current].reset(); setTimeout(() => ctrls[current].play(), 40); }
});

goTo(0);
</script>
